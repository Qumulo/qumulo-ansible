- id: QUIRK-018
  behaviour: >-
    A cluster that stores a join key while its Nexus connection is on registers with it by itself within about two
    seconds, and `POST /v1/nexus/registration/rotate` sent in that window answers 412 `db_revision_mismatch_error`
    without doing anything. A UUID retired in Nexus registers again this way, and Nexus keeps it `DECOMMISSIONED`.
  workaround: >-
    After a 412 from rotate, reads the registration status: `REGISTERED` is success, and while it is
    `PENDING_REGISTRATION` rotate is sent again, up to three times, two seconds apart
  workaround_owner: nexus_registration
  status: implemented
  unit_pin: tests/unit/plugins/modules/test_nexus_registration.py::test_a_rotate_that_races_the_clusters_own_registration_reads_the_status
  integration_pin: "none: the race depends on timing; the Nexus part of nexus_registration usually meets it"
  first_seen: "7.10.3"
