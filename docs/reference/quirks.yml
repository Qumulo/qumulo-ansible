  workaround: >-
    `replication_relationship` refuses an empty timezone where one is set, and blackout windows without a timezone,
    before any write (G-REPL-TZ)
  workaround_owner: replication_source.ReplicationRelationship
  status: implemented
  unit_pin: tests/unit/plugins/modules/test_replication_relationship.py::test_an_empty_timezone_where_one_is_set_fails_before_any_write
  integration_pin: quirk_replication_timezone
  first_seen: "7.10.3A"
