  first_seen: "7.10.3A"
- id: QUIRK-022
  behaviour: >-
    When the gateway in front of Nexus fails the cluster's registration call with an HTML error page, such as 502 Bad
    Gateway, `POST /v1/nexus/registration/rotate` answers 400 `decode_error`, quoting the page after `body was:`.
  workaround: >-
    An HTML page whose title is a 5xx status is transient: rotate reads the registration status, succeeds on
    `REGISTERED`, and while it is `PENDING_REGISTRATION` is sent again, backing off from two seconds to fifteen, until
    `retry_timeout` runs out
  workaround_owner: nexus_registration
  status: implemented
  unit_pin: tests/unit/plugins/modules/test_nexus_registration.py::test_a_rotate_answered_with_a_nexus_gateway_page_is_sent_again_while_pending
  integration_pin: "none: it takes a failing gateway in front of Nexus"
  first_seen: "7.10.3A"
