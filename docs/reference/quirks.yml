# The quirk register: server behaviours the collection works around. Each entry:
#   id:               QUIRK- and three digits; code, tests and targets cite it
#   behaviour:        what a client of the REST API sees
#   workaround:       what the collection does about it
#   workaround_owner: the module, module_utils file, or module_utils symbol that owns the
#                     workaround (client.QumuloClient.paginate), or a list of them
#   status:           implemented, or planned while no owner exists yet; the unit contract
#                     test fails when a planned quirk's owners all exist
#   unit_pin:         the unit test that pins the workaround, as tests/unit/<file>.py::test_<name>;
#                     or "n/a: <reason>", only on a quirk whose workaround is documentation,
#                     which also sets docs_only: true
#   integration_pin:  the target under tests/integration/targets/ that fails when the quirk stops
#                     reproducing; "pending: <target> with <module>" while that target waits for
#                     a module that has not landed (the pin fails once the module exists); or
#                     "none: <reason>" when no tier 1 target can pin it
#                     The unit contract test checks both pins' form always, and once a quirk is
#                     implemented, that the unit test and the target exist and cite its id.
#   first_seen:       the first Qumulo Core release the quirk was observed on
#   fixed_in:         optional; the first Qumulo Core release that no longer has the quirk. The
#                     workaround stays while the collection supports an earlier release.
# Run `python tools/render_registers.py` after editing; docs/reference/quirks.md is generated.
---
- id: QUIRK-001
  behaviour: >-
    When `hide_shares_from_unauthorized_users` and `hide_shares_from_unauthorized_hosts` differ, the ETag from
    `GET /v1/smb/settings` never matches what PATCH checks, so a PATCH with that If-Match returns 412.
  workaround: The SMB settings route never sends If-Match (`etag=omit`); last writer wins
  workaround_owner: smb_settings
  status: implemented
  unit_pin: tests/unit/plugins/modules/test_smb_settings.py::test_smb_settings_never_sends_if_match
  integration_pin: quirk_smb_settings_etag
  first_seen: "7.10.3"
- id: QUIRK-002
  behaviour: An identical `PUT /v3/network` re-runs static and floating IP allocation.
  workaround: No PUT without a difference
  workaround_owner: network_config
  status: implemented
  unit_pin: tests/unit/plugins/modules/test_network_config.py::test_identical_network_sends_no_put
  integration_pin: network_config
  first_seen: "7.10.3"
