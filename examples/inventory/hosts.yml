# One hub and one unprotected edge that caches the hub's /projects through a
# portal. Copy this directory as your inventory/, and use the directory as the
# inventory, so that Ansible reads group_vars/ and host_vars/ beside this file:
#
#   ansible-playbook qumulo.cluster.baseline -i inventory --ask-vault-pass --check --diff
#
# The example ships no certificates. Put the CA that signed your clusters'
# certificates in files/qumulo-ca.pem beside inventory/, or set qumulo_ca_path
# to where it is.
#
# The secrets here are encrypted with the vault password "example"; encrypt
# your own with `ansible-vault encrypt_string`. docs/reference/variables.md
# lists each variable, and docs/tutorials/first-cluster.md walks through a first run.
#
# The playbooks run on qumulo_clusters or qumulo_edges. qumulo_hubs names the
# hubs that edges pair with, and a rebuild finds an edge's hub there. Every
# host is a REST endpoint, so the modules run on the controller
# (ansible_connection in group_vars/qumulo_clusters.yml).
all:
  children:
    qumulo_clusters:
      children:
        qumulo_hubs:
          hosts:
            hub01:
              # The address the REST API answers on. You set it; with Terraform the
              # qumulo.cluster.terraform inventory plugin sets it from the root's output.
              qumulo_api_host: 10.0.0.10
              # The UUID every module checks before it sends credentials. Same owners as
              # qumulo_api_host; playbooks/capture.yml -e qumulo_adopt=true reads it from
              # a cluster nobody recorded it for.
              qumulo_cluster_uuid: aaa55f64-ed03-4d6d-a600-6889d7b20ee5
        qumulo_edges:
          hosts:
            edge01:
              qumulo_api_host: 10.20.0.5
              # A rebuild gives the edge a new UUID; apply the host_vars patch its report
              # writes, here or in host_vars/edge01.yml.
              qumulo_cluster_uuid: cbb6f13a-d92f-4dfb-a7f0-d0a6785da65d
