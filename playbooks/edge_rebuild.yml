# The replay of an edge rebuild, on the reinstalled edge: the
# qumulo.cluster.edge_rebuild role forms the edge again, or adopts one formed
# by hand with -e qumulo_new_cluster_uuid=<UUID>, deletes the hub's record of
# the old UUID, brings the edge to its baseline, pairs it with its hub, and
# writes artifacts/<edge>/rebuild-<UTC>.yml with the host_vars patch and what
# is left to hands. The declaration is explicit, so a wrong host fails closed:
#
#   ansible-playbook playbooks/edge_rebuild.yml -l edge01 -e qumulo_rebuild=true
#
# -e edge_rebuild_phase=all runs the predestroy phase, the tasks file in
# edge_rebuild_reinstall_tasks and the replay in one run.
- name: Rebuild each edge
  hosts: qumulo_edges
  serial: 1
  gather_facts: false
  module_defaults:
    group/qumulo.cluster.qumulo:
      api_host: "{{ qumulo_api_host }}"
      api_port: "{{ qumulo_api_port | default(8000) }}"
      api_username: "{{ qumulo_api_username | default('admin') }}"
      api_password: "{{ qumulo_api_password | default('') }}"
      api_token: "{{ qumulo_api_token | default('') }}"
      validate_certs: "{{ qumulo_validate_certs | default(true) }}"
      ca_path: "{{ qumulo_ca_path | default(omit) }}"
      expected_cluster_uuid: "{{ qumulo_cluster_uuid | default('') }}"
  roles:
    - role: qumulo.cluster.edge_rebuild
      vars:
        edge_rebuild_phase: replay
