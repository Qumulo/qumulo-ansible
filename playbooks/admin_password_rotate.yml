# Changes the password of each cluster's admin user to qumulo_api_password_after,
# with qumulo.cluster.local_user, and connects the rest of the play with it.
# The cluster applies admin's password to every node's console and SSH password
# too (G-ADMIN-OS), so the playbook changes those as well.
#
# Give the new password in the inventory, encrypted like the current one, as
# qumulo_api_password_after, and run it with --check first:
#
#   ansible-playbook playbooks/admin_password_rotate.yml -l edge01 --check
#   ansible-playbook playbooks/admin_password_rotate.yml -l edge01
#
# Then make the new password the host's qumulo_api_password, usually by
# replacing vault_qumulo_api_password, and remove qumulo_api_password_after.
# Until then every other playbook still logs in with the old password, and fails.
#
# The password cannot be read back (G-PASSWORD), so the playbook first logs in
# as admin with the new password: when that works, the password is already
# rotated, and a second run changes nothing. Check mode reports the change and
# writes nothing. No task shows either password.
- name: Rotate the admin password
  hosts: qumulo_clusters
  gather_facts: false
  module_defaults:
    group/qumulo.cluster.qumulo:
      api_host: "{{ qumulo_api_host }}"
      api_port: "{{ qumulo_api_port | default(8000) }}"
      api_username: "{{ qumulo_api_username | default('admin') }}"
      api_password: "{{ qumulo_api_password | default('') }}"
      api_token: "{{ qumulo_api_token | default('') }}"
      validate_certs: "{{ qumulo_validate_certs | default(true) }}"
      ca_path: "{{ qumulo_ca_path | default(omit) }}"
      expected_cluster_uuid: "{{ qumulo_cluster_uuid | default('') }}"
  tasks:
    - name: Check that the inventory gives the new password
      ansible.builtin.assert:
        that: qumulo_api_password_after | default('') | length > 0
        fail_msg: "{{ inventory_hostname }}: set qumulo_api_password_after to admin's new password"
        quiet: true

    # cluster_guard returns cluster_id when the login works, and a rejected
    # login fails at once with status 401. Any other failure, such as the wrong
    # cluster, fails the task.
    - name: Log in as admin with the new password, to see whether it is already set
      qumulo.cluster.cluster_guard:
        api_username: admin
        api_password: "{{ qumulo_api_password_after }}"
        api_token: ""
      register: admin_password_rotate_login
      failed_when: admin_password_rotate_login.cluster_id is not defined and admin_password_rotate_login.status | default(none) != 401

    - name: Change admin's password
      qumulo.cluster.local_user:
        name: admin
        password: "{{ qumulo_api_password_after }}"
        update_password: always
        allow_admin_password_change: true
        allow_management_disruption: true
      register: admin_password_rotate_change
      when: admin_password_rotate_login.status | default(none) == 401

    # module_defaults read qumulo_api_password, so later tasks log in with the
    # new one, as do later plays of the same run that import this playbook first.
    - name: Connect with the new password from here on
      ansible.builtin.set_fact:
        qumulo_api_password: "{{ qumulo_api_password_after }}"
      no_log: true
      when: >-
        admin_password_rotate_change.connection_password_changed | default(false)
        or (admin_password_rotate_login.cluster_id is defined
            and qumulo_api_username | default('admin') == 'admin' and qumulo_api_token | default('') | length == 0)

    - name: Check that admin logs in with the new password
      qumulo.cluster.cluster_guard:
        api_username: admin
        api_password: "{{ qumulo_api_password_after }}"
        api_token: ""
      when: admin_password_rotate_change is changed and not ansible_check_mode
