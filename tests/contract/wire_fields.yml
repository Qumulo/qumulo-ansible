# The request fields each write route sends, for the contract tests to compare
# with the request schema in /openapi.json. Every POST, PUT and PATCH of a Route
# in plugins/module_utils/ needs an entry:
#   route:  the Route as file.NAME, such as client.LOGIN
#   method: POST, PUT or PATCH
#   fields: {field path: the JSON type sent}. A path is dotted from the body,
#           with [] for an array's items (restrictions[].require_tls); $body is a
#           body that is a bare value. Types: string, integer, number, boolean,
#           array, object. List every field any request on the route can send.
---
- route: client.LOGIN
  method: POST
  fields:
    username: string
    password: string
- route: identity.FIND
  method: POST
  fields:
    domain: string
