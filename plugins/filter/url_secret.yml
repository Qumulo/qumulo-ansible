---
DOCUMENTATION:
  name: url_secret
  short_description: The secret parts of an upgrade image's URL
  version_added: 0.1.0
  author: Qumulo, Inc. (@Qumulo)
  description:
    - The query string and the user information of one C(qumulo_upgrade_images) entry's image, each on its own, so that
      each can be masked on its own. Both are null for a path, or for a URL with neither.
    - The value is what M(qumulo.cluster.upgrade) takes as C(image_secret), which the module joins back to C(image), the
      URL given through P(qumulo.cluster.redact_images#filter). The C(cluster_upgrade) role passes it that way.
  options:
    _input:
      description: One entry of C(qumulo_upgrade_images), a URL, a path, or a mapping C({version, image, kind, build}).
      type: raw
      required: true

EXAMPLES: |
  - name: Upgrade to an entry given as a URL, with its secret parts passed apart from it
    vars:
      entry: "{{ qumulo_upgrade_images[0] }}"
    qumulo.cluster.upgrade:
      image: "{{ [entry] | qumulo.cluster.redact_images | first }}"
      image_secret: "{{ entry | qumulo.cluster.url_secret }}"

  - name: Upgrade to an entry given as a mapping, whose image is its image field
    vars:
      entry: "{{ qumulo_upgrade_images[0] }}"
    qumulo.cluster.upgrade:
      image: "{{ ([entry] | qumulo.cluster.redact_images | first).image }}"
      image_secret: "{{ entry | qumulo.cluster.url_secret }}"
      version: "{{ entry.version }}"
      build: "{{ entry.build | default(omit) }}"

RETURN:
  _value:
    description: The secret parts of the image's URL.
    returned: always
    type: dict
    contains:
      userinfo:
        description: The user information of the URL, such as C(user:password), or null when there is none.
        type: str
        sample: user:p%40ss
      query:
        description: The query string of the URL, or null when there is none.
        type: str
        sample: X-Amz-Signature=abc&X-Amz-Expires=14400
