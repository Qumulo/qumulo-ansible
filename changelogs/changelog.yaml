          whose source was rebuilt since is the only copy, needing local_data and
          replication acknowledged, since rebuilding the edge ends the hold on the
          source's side. A relationship out of the edge is held while its record is
          live, its replication snapshots exempt only while the target holds a live
          replica. ``replication`` needs acknowledging only for the relationships
          the inventory does not declare, each listed by its id, its peer's UUID and
          both paths, and for a declared source whose record is ENDED or pending.
