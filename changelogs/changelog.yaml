          on the way, with the ``cluster_upgrade`` role. It plans the whole fleet
          from every inventory host's reads and ``qumulo_upgrade_*`` variables before
          it sends anything but reads, and fails with every refusal at once; before
          the plan, lists the restore records and locks under each ``edge_rebuild_artifact_dir``
          and warns (W1) of each open record, and each live lock on a host it does
          not lock, that names a host it moves or reboots, and goes on; takes each
          moved host's restore lock, and each source's that replicates to one, for
          the whole run and releases them at every end the run reaches, a run stopped
          with Ctrl-C or killed excepted; and fails at its end when a hop stopped
          the run. ``qumulo_upgrade_api_host`` gives the address it connects to in
          place of ``qumulo_api_host``, for a cluster behind a load balancer that
          closes idle connections. In check mode it predicts each host's first hop
          and each lock, and changes nothing on the clusters. It refuses
          ``qumulo_upgrade_aggressive=true``.
        - 'upgrade_plan - new module that plans a fleet''s Qumulo Core upgrade from
          every inventory host''s reads and upgrade variables before anything is sent:
          the hops, one release at a time in lock-step, each host''s image and reboot
          mode, the order of each hop''s commits, a portal component''s spokes before
          their hub and a replication target before its source, the hosts a failure
          holds, the restore locks the run takes, and from ``restore_files`` the W1
          warnings for the open restore records and live restore locks that name a
          host it moves. Any refusal stops the whole plan. With ``window``, it answers
          only whether a hop''s commits may begin now by the hosts'' maintenance windows.'
        - 'upgrade_report - new module that turns one hop of the plan and each host''s
          registered upgrade results into the hop''s report: each host''s releases,
          phase times, outage, reboot and outcome, the host whose failure held a held
          one, each portal component''s mismatch window and whether the hop left it
          on two releases, and the peer readings. It reads only the results'' return
          fields, and redacts every URL''s query string and user information.'
        - user_defined_mappings - new module that sets the cluster's whole list of
          mappings from Active Directory users to LDAP users with PUT and If-Match,
          compared without regard to order. It refuses a list the cluster would refuse
          before any request, and outside a domain refuses a list that is not empty
          before the PUT, which the cluster would answer with 500 (QUIRK-031). The
          ``cluster_baseline`` role applies ``qumulo_user_defined_mappings`` after
          the domain join, and ``capture_info`` reads it back in the new ``identity_mappings``
          area.
        - version - a version gate on a cluster that serves no OpenAPI document is
          decided by the cluster's release, with a warning.
        - version parsing - a respin letter in the version a cluster reports, such
          as ``Qumulo Core 7.10.3A``, is accepted by every version fact, gate and
          floor check.
        - web_ui_settings - new module that sets the Web UI's login banner and inactivity
          timeout, in minutes, with If-Match. An empty banner removes it and a timeout
          of 0 turns it off. cluster_baseline applies ``qumulo_web_ui_settings`` after
          the file system settings, and capture_info reads it back as the new ``web_ui``
          area, which clone_host_vars copies.
      release_summary: '0.1.0 is the first release of qumulo.cluster, an Ansible collection
        for day-2 configuration of Qumulo Core clusters. You declare shares, exports,
        identity, portals, quotas, snapshot policies, licensing and monitoring in
        an inventory, and the collection applies them through the Qumulo REST API.
        Its roles also rebuild an unprotected edge, upgrade a fleet hop by hop,
        and pair, fail over and fail back replication. Every module supports check mode, and every module that changes a cluster
        supports diff mode, so you see each change before you make it. 0.1.0 was tested
        on Qumulo Core 7.10.3 build 385145.1.82, on single-node Qumulo Core containers,
        a single-node Cloud Native Qumulo (CNQ) cluster in AWS, and a four-node cluster
        on lab hardware. The collection needs Qumulo Core 7.10.3 or later and ansible-core
        2.20 or later. It is a pre-release: interfaces may change before 1.0.0, and
        it is not supported for production use yet. The documentation index is ``docs/README.md``
        in the installed collection and in the public repository Qumulo/qumulo-ansible
        on GitHub.'
