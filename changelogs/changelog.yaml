---
ancestor: null
releases:
  0.1.0:
    changes:
      deprecated_features:
        - 'network_config - the ``tenant_id`` suboption of ``frontend_networks`` is
          deprecated and will be removed in 0.3.0. It is still accepted beside ``tenant``
          when both name one tenant, so a document read with ``network_info`` can
          be given back, and refused when they differ. An id that no tenant has is
          dropped with a warning, and the network keeps the tenant the cluster reports.
          Remedy: name the tenant with ``tenant``.'
        - 'smb_share, nfs_export - the ``tenant_id`` option is deprecated and will
          be removed in 0.3.0. It is still accepted beside ``tenant`` when both name
          one tenant, so a share or export read with ``smb_info`` or ``nfs_info``
          can be given back, and refused when they differ, naming both. Alone, it
          is used as given, and refused when the tenant list can be read and no tenant
          holds it, except with ``state: absent``, which then changes nothing. Remedy:
          name the tenant with ``tenant``, or with ``tenants`` for several.'
      minor_changes:
        - Documentation - docs/how-to/nfs-kerberos.md serves NFS with Kerberos from
          a standalone KDC.
        - 'Documentation - the pages under docs/ are split by what the reader wants:
          docs/tutorials/ for learning on a cluster you already run, docs/how-to/
          for one task each, docs/reference/ for facts to look up, and docs/explanation/
          for why the collection works the way it does. docs/README.md lists every
          page. The gap and quirk registers and the troubleshooting page are in docs/reference/.'
        - The Nexus modules take an optional Nexus user's API token (``nexus_api_token``)
          to mint join keys and retire clusters.
        - 'The collection is MIT apart from these GPL-3.0-or-later files: the inventory
          plugin ``qumulo.cluster.terraform``, the action plugin of ``qumulo.cluster.replication_restore_lock``
          and the filter plugins in ``plugins/filter/``, with the unit tests of the
          inventory and action plugins; ``LICENSES/GPL-3.0-or-later.txt`` holds the
          license text.'
        - The tenant and tenant_info modules, and the tenant options of the existing
          modules, use the multitenancy REST API, which Qumulo marks as preview in
          Qumulo Core 7.10.3 and 7.11.0; a later release may change it.
        - access_token - new module that makes sure a user holds an access token,
          rotates the user's tokens, making the new one before it deletes the old,
          or revokes them, and sets ``enabled`` and ``expiration_time``. The cluster
          stores no name for a token, so a user's tokens are managed as one set. It
          writes a new token's bearer at once to a file of its own in ``secret_destination``,
          readable only by its owner, returns it in that run only, and refuses
          to make a token unless the task sets ``no_log`` and a destination. It refuses to delete,
          disable or expire the token the task connects with unless ``allow_management_disruption``
          is set.
        - artifact_dir - new filter that gives the cluster_baseline and edge_rebuild
          roles their artifact directory, beside the inventory source on disk that
          defines the host, and none for a host list such as ``-i edge01,``.
        - audit_destination - new module that creates, changes or deletes an audit
          log destination by name, writing its whole configuration with PUT. It refuses
          any write while its terraform_owned_areas option lists audit, and a write
          to a CloudWatch destination while it lists audit.cloudwatch, unless take_over_from_terraform
          is true.
        - auth_cache_clear - new action module that clears the cluster's cache of
          identities and group memberships, always reporting a change (G-ACTIONS)
          and in check mode clearing nothing. The ``cluster_baseline`` role runs it
          after a user-defined mapping or an identity's home directory changed, even
          when a later step of the two fails.
        - authoritative_dns - new module that turns the cluster's authoritative DNS
          server on or off and sets its name, the clients that may query it and how
          long answers may be cached, comparing client ranges as sets of addresses
          and refusing enabled and fqdn where Terraform owns them.
        - capacity_clamp - the default ``rounding_tolerance`` is the larger of 1%
          of the request and 8 GiB. On a small edge the server rounds the clamp up
          to a whole 8 GiB unit, so a smaller tolerance would refuse a second run
          of the same request as a decrease.
        - capacity_clamp, portal_eviction_settings and edge_cache_route - new modules,
          and the edge_cache_resize role and playbooks, to resize an unprotected edge's
          cache without a rebuild where the server allows it.
        - capture.yml - ``qumulo_capture_dir`` defaults to a ``captures`` directory
          beside the inventory source, so Ansible does not read the capture files
          as inventories.
        - 'capture.yml - adoption leaves out of the host_vars file each SMB share or
          NFS export entry that the inventory already declares with the same values,
          compared as the modules compare them, or removes, with a comment naming
          the inventory''s entry and any key the cluster keeps that no entry declares.
          Before it writes the host_vars file, it refuses a network the inventory
          declares too and an entry the inventory declares with other values. Leaving
          out only the variables the inventory defines would not be enough: a
          flat ``qumulo_smb_shares``, ``qumulo_nfs_exports`` or
          ``qumulo_network``, or a ``qumulo_factory_defaults`` removal, in
          group_vars stays in force beside the ``qumulo_tenants`` that adoption
          writes, and the baseline would refuse what is declared twice. The
          ``host_vars_duplicates`` filter makes the per-entry comparison.'
        - 'capture.yml - captures everything the collection configures through ``capture_info``:
          identity, DNS, time, local users and groups and role members, the network
          document, cloud monitoring and the Nexus connection, the eviction threshold
          and an active license, the AD membership, the spoke portal, directories,
          the SMB and NFS settings, shares and exports and whether the factory share
          and export are present, quotas, snapshot policies and the replication relationships
          the cluster is the source of, and ``qumulo_portal_hosts`` and ``qumulo_replication_address``
          from the peers captured in the same run when their records agree. The file
          is sorted, so a second capture of an unchanged cluster writes the same file,
          and ends with comments naming each secret to supply and what was left out.
          Areas Terraform owns are not written to the capture file. With ``qumulo_adopt=true``
          it writes the host''s host_vars beside the inventory source that defines
          it, with what the inventory does not already define, never rewriting an
          existing file.'
        - capture.yml - the capture and adopted host_vars files tag each string they
          are written with ``!unsafe``, and only those strings, so a template added
          to the file by hand is still evaluated. Ansible templates the strings it
          reads from an inventory file, so without the tag a share description or
          other value holding a Jinja expression would run on the controller at the
          next play that read the file. The comments that end the files wrap every
          line, so a newline in a captured path cannot end a comment.
        - 'capture.yml - when the inventory defines ``qumulo_tenants``, adoption keeps
          what the capture holds under each tenant, entry by entry. Each share and
          export of a captured tenant that the inventory does not declare is written
          in the flat ``qumulo_smb_shares`` or ``qumulo_nfs_exports`` with ``tenants``
          naming its tenant, one the inventory declares the same way is left out with
          a comment, and a captured tenant the inventory does not declare or removes
          gets a comment. Adoption refuses, and writes no host_vars file, when the
          inventory declares a captured share or export with other values, declares
          a captured tenant''s switches or settings otherwise, or does not list a
          captured tenant network for that tenant, or lists it with other values,
          since the baseline''s network document would leave it out or rewrite it.
          A captured ``tenants: all`` entry is written as the list of the captured
          tenants when the inventory declares other tenants, a tenant the inventory
          renames is matched by its ``previous_name``, and the capture''s ``Default``
          with ``state: absent`` is not written and gets a comment.'
        - capture_info - ``qumulo_factory_defaults`` reports the factory ``Files``
          share and ``/`` export of tenant 1 only; a share or export of that name
          in another tenant does not count.
        - 'capture_info - a capture with the ``tenants`` area, as the default ``gather_subset:
          [all]`` reads, writes ``qumulo_tenants`` and puts each share and export,
          and each network a tenant holds off the backend bond, under its tenant''s
          entry. ``qumulo_smb_shares`` and ``qumulo_nfs_exports`` hold only the shares
          and exports identical in two or more tenants, with ``tenants``, and no network,
          share or export carries ``tenant_id``. On a cluster with one tenant, leaving
          the ``tenants`` area out keeps the shares, exports and networks in the flat
          lists.'
        - 'capture_info - a cluster without tenant 1 is captured with ``{name: Default,
          state: absent}`` in ``qumulo_tenants``, and with the factory share and export
          ``absent`` in ``qumulo_factory_defaults``, so a rebuild from the inventory
          drops the ``Default`` tenant, ``Files`` share and ``/`` export that a newly
          formed edge has and the old one lacked. No such entry is written when another
          tenant is named ``Default``, or when a replay of the capture could not delete
          ``Default``: a network on the backend bond stays in ``qumulo_network.frontend_networks``,
          or ``leave_out`` names ``network``, ``smb`` or ``nfs``. A network no tenant
          holds always gets the entry. The ``tenant 1`` note in ``left_out`` says
          which case applies and what to do. Qumulo marks the multitenancy REST API,
          which capture reads the tenants through, as preview; a later Qumulo Core
          release may change it.'
        - 'capture_info - a cluster without tenant 1 whose networking the host manages
          (no managed interfaces, only HOST networks) is captured with ``previous_name:
          Default`` on the one tenant that holds a network, and no ``Default`` entry,
          when every network has a tenant, the ``network``, ``smb`` and ``nfs`` areas
          are read and no tenant is named ``Default``. A rebuild from the capture
          renames the ``Default`` the new edge forms with to that tenant, which keeps
          the HOST network, the one the play reaches REST on, in tenant 1 throughout.
          ``smb_files_share`` is ``present`` when the capture writes a share named
          ``Files``, in any letter case, for that tenant, and ``nfs_root_export``
          when it writes that tenant''s export at ``/``, since the rebuilt edge''s
          tenant 1 is that tenant. A ``/`` export of that tenant''s that the capture
          leaves out, as for a deleted mapped user, keeps ``Default`` absent, since
          a rebuild that waives the export''s drift would otherwise leave the factory
          ``/`` export in its place. In the other cases the capture writes ``Default``
          absent. The ``tenant 1`` note in ``left_out`` says which. ``clone_host_vars``
          keeps the ``previous_name``, so a fresh target''s ``Default`` is renamed
          to that tenant.'
        - capture_info - also returns ``spoke_roots``, the directories of the cluster's
          spoke portals' roots, and ``replication_targets``, the directories it receives
          replication into, which a clone of it leaves out.
        - 'capture_info - an NFS export restriction whose ``require_tls`` is false
          is captured without it, which declares the same restriction, since Qumulo
          Core stores false when it is unset, and ``nfs_export`` refuses ``require_tls:
          false`` on a release before 7.11.0. A restriction that requires TLS is captured
          with ``require_tls: true``.'
        - 'capture_info - new area ``tenants`` in ``gather_subset`` and ``leave_out``,
          which writes ``qumulo_tenants``, sorted by name. Each entry holds the tenant''s
          six services, its networks (``[]`` for none), its SMB and NFS settings (``inherit``
          without settings of its own, else the full record), and its shares and exports,
          each list left out when it has none. Tenant 1 renamed is written with ``previous_name:
          Default``. Qumulo marks the multitenancy REST API, which the area reads,
          as preview; a later Qumulo Core release may change it.'
        - capture_info - new audit area, which captures the audit log destinations
          as qumulo_audit_destinations, and leave_out takes audit.cloudwatch, which
          leaves out the CloudWatch destinations.
        - capture_info - new module that reads every setting the collection's modules
          write and the cluster reads back, and returns it as the cluster_baseline
          role's variables in the shape the role passes to those modules, with the
          secrets to supply and what it left out named apart.
        - capture_info - on a cluster with two or more tenants, the ``smb`` and ``nfs``
          areas without the ``tenants`` area write ``qumulo_smb_shares`` and ``qumulo_nfs_exports``
          empty and note each tenant's shares, exports and SMB and NFS settings in
          ``left_out``. To write them, add ``tenants`` to ``gather_subset``, which
          puts them under their tenants.
        - 'capture_info - reading the ``network``, ``smb``, ``nfs`` or ``tenants``
          area reads the tenant list, and the ``smb`` and ``nfs`` areas each tenant''s
          SMB or NFS settings, so the user the play connects as needs ``PRIVILEGE_TENANT_READ``,
          without which the capture fails. The ``tenants`` area also reads the protection
          type. Remedy: give the user read access to the tenants.'
        - capture_info - reads the FTP server settings back as the new ``ftp`` area,
          which writes ``qumulo_ftp_settings``. An anonymous user that names a deleted
          local user, or is anything but a local user, is left out with a note. A
          capture of every area reads the FTP settings, which needs ``PRIVILEGE_FTP_READ``.
        - capture_info - the ``s3`` area captures each S3 access key by its owner
          and id as ``qumulo_s3_access_keys``, and names each key's secret, which
          the cluster never returns, under ``supply``.
        - capture_info - the ``s3`` area captures each bucket's policy as ``qumulo_s3_bucket_policies``,
          each principal as a trustee, leaving out, with the reason, a policy with
          a principal /v1/identity/find cannot resolve.
        - capture_info - the ``s3`` area captures the buckets outside the spoke roots
          as ``qumulo_s3_buckets``, and the ``directories`` area declares each bucket's
          directory.
        - capture_info - the ``snapshots`` area lists each key of the file system
          key store in ``left_out`` by name and id, since a key is registered only
          with its private key or a signature of its name.
        - capture_info - the dns area also reads the authoritative DNS settings, as
          qumulo_authoritative_dns, and leave_out takes dns.fqdn, which leaves out
          enabled and fqdn.
        - capture_info - the dns area also reads the lookup overrides, as qumulo_dns.lookup_overrides.
        - 'capture_info - the following are noted in ``left_out``: a cloud cluster''s
          tenant services, which are not written since no cloud cluster accepts a
          tenant write (G-TENANT-CLOUD); a missing tenant 1; a tenant on its own identity
          configuration, written in full except its identity; with the ``tenants``
          area, or on a cluster with two or more tenants, a VLAN that carries two
          tenants'' networks, or a tenant''s and an unbound one; and, on a cluster
          with two or more tenants, a backend network a tenant holds (G-TENANT-BACKEND),
          and an unbound network.'
        - capture_info - the new ``kerberos`` area writes ``qumulo_kerberos`` on every
          capture, and names a held keytab's principals in a supply line, without
          the keytab. Naming them reads the keytab, which needs ``PRIVILEGE_KERBEROS_KEYTAB_READ``;
          a user without it, such as a member of the built-in Observers role, gets the setting and
          a ``left_out`` entry in place of the supply line, and the capture goes on.
        - capture_info - the new ``s3`` area captures the S3 server settings as ``qumulo_s3_settings``,
          and the ``directories`` area declares the base path's directory, which ``s3_settings``
          requires to exist.
        - capture_info - the ssl area also captures the cipher suites, as qumulo_ssl_ciphers.
        - capture_info - with the ``tenants`` area, a VLAN that carries a tenant's
          network and a network no tenant holds stays in ``managed_interfaces``, and
          the tenant network carries its ``vlan_id`` too, so the baseline's step 2
          refuses it as declared in two places rather than take the other network
          off the VLAN. The refusal says to list that network under the VLAN's tenant
          with its ``vlan_id`` and remove the VLAN from ``frontend_vlans``, or to
          give each network a VLAN of its own.
        - capture_info - with the ``tenants`` area, a tenant network's VLAN is written
          on the network as ``vlan_id``, with ``mtu`` when the VLAN sets one. ``managed_interfaces``
          then lists neither the VLANs that carry only tenant networks nor tenant
          networks on the frontend bond. A backend-bond network and a network no tenant
          holds stay in ``qumulo_network.frontend_networks``.
        - capture_info - without the ``tenants`` area (left out of ``gather_subset``,
          named in ``leave_out``, or not offered by the cluster), every network is
          written in ``qumulo_network.frontend_networks``. On a single-tenant cluster
          no ``tenant`` is written, the shares and exports are written flat, and the
          tenant's own SMB and NFS settings are noted in ``left_out``. On a multi-tenant
          cluster each network a tenant holds off the backend bond carries ``tenant``
          by name.
        - 'capture_info - writes ``qumulo_capacity.license: none`` for an unprotected
          edge that holds no license.'
        - capture_info - writes each snapshot policy's ``lock_key`` by the key's name,
          so a replay sets it again; when the key store cannot be read, or when the
          key has no name (QUIRK-120), it leaves the key out with a ``left_out`` note.
        - client - an error that quotes a URL, from the server's description or a
          redirect's location, quotes it without its query string or user information.
        - 'clone_edge.yml - new playbook that gives a fresh cluster another cluster''s
          configuration: it captures the source, changing nothing on it, writes the
          target''s host_vars file with clone_host_vars, and runs the baseline on
          the target, the first pass, with the secrets ``clone_edge_supply`` gives
          for that run only. Configuration only, no data. A second run writes the
          same file and changes nothing, and a run that would write a different file
          refuses.'
        - clone_edge.yml - the clone leaves out of the target's host_vars file each
          share or export entry that the target's inventory already declares or removes,
          with a note, for the same reason as adoption. Since the target creates the
          share or export from the inventory's entry alone, the clone refuses, before
          it writes anything, an entry the inventory declares with other values or
          without a key the source's entry sets to other than what a create gives.
        - 'clone_host_vars - a ``qumulo_tenants`` entry with ``state: absent`` is
          left out of the clone with a note, since the target''s ``Default`` holds
          the target''s own networks; declare it absent on the target once its networks
          are under a tenant that stays. A target whose capture notes a missing tenant
          1 has no tenant from formation, so the fresh-target check counts each tenant
          it holds, and a clone onto such a target fails unless ``allow_configured_target``
          is set. The rule copies tenants that Qumulo''s multitenancy REST API, marked
          as preview, defines; a later Qumulo Core release may change them.'
        - 'clone_host_vars - a target whose capture holds a tenant beyond the one
          formation creates, or a share or export in any tenant other than the factory
          ``Files`` and ``/`` in the tenant formation creates, is refused as not fresh
          unless ``allow_configured_target`` is set. The clone_edge playbook''s target
          capture reads the ``tenants`` area, so its fresh-target check sees them.
          Remedy: clone onto a newly formed cluster, or set ``allow_configured_target``
          (``clone_edge_allow_configured_target``) for a second run of the same clone.'
        - clone_host_vars - copies ``qumulo_ftp_settings``.
        - clone_host_vars - copies the S3 settings, buckets and bucket policies, leaving
          out a bucket, its policy and the base path in the source's spoke roots or
          on what it receives replication into, and the source's access keys, each
          with a note; a target that holds an S3 bucket or access key is not fresh.
        - clone_host_vars - copies the TLS cipher suites and the audit log destinations,
          except the CloudWatch destinations, whose log group and region are the source's,
          which it leaves out with a note.
        - 'clone_host_vars - new module that derives a fresh cluster''s host_vars
          from another cluster''s capture, with a rule for every variable a capture
          holds: the clone''s own UUID and a new name; AD settings copied for a fresh
          join, with supply lines for the join credentials, the clone''s own Nexus
          join key and a license for its UUID; and no portal, replication relationship,
          network document, or share, export or directory in the source''s spoke roots
          or receiving its replication, each left out with a note. It refuses a target
          that is the source or holds configuration of its own, and a name another
          cluster has.'
        - 'clone_host_vars - new rule for ``qumulo_tenants``. Each tenant keeps its
          name, ``previous_name``, services and SMB and NFS settings, and its networks
          are dropped with a note per tenant, since they hold the source''s addresses.
          Its shares and exports are filtered as the flat lists are: one in a spoke
          root of the source''s portal, or in a directory the source receives replication
          into, is left out with a note that names its tenant.'
        - cluster_baseline - ``cluster_baseline_replication_on_held`` set to ``report``
          keeps a held relationship as a result instead of failing step 21, as the
          rebuild's replay does.
        - 'cluster_baseline - ``qumulo_capacity.license: none`` declares an edge that
          runs without a license, within the capacity its formation gives it. The
          license step hands nothing off for it and writes its clamp with no license,
          in the first pass and the second; a ``pending`` or ``required`` edge''s
          clamp still waits for its license. The step refuses ``none`` beside a license
          document, before anything applies the document. While a clamp waits, the
          step reads the stored one, and the hand-off says when the license''s cap
          will apply at the next quorum formation without a clamp write. On an edge
          with a declared clamp, it warns when a held license''s cap still waits for
          a quorum formation, and on a ``none`` edge that holds a license after all,
          that ``none`` is stale.'
        - 'cluster_baseline - ``tenant_id`` on an entry of ``qumulo_smb_shares`` or
          ``qumulo_nfs_exports`` is deprecated; the plan translates it to ``tenants``
          with a warning, and skips an entry whose id no tenant has, with a warning.
          A flat entry of ``qumulo_network.frontend_networks`` names its tenant with
          ``tenant``, and its ``tenant_id`` is translated with a warning too. Remedy:
          write ``tenants`` on a share or export, and ``tenant`` on a network.'
        - 'cluster_baseline - a ``qumulo_terraform_owned_areas`` the inventory gives
          is all that Terraform owns, an empty list included, so a list that leaves
          out ``network.floating_ips`` gives the floating addresses to the role. A
          host with ``qumulo_cluster_kind: cnq`` and ``qumulo_managed_by: terraform_provider``
          whose list leaves the area out is refused before any write, as the Terraform
          inventory plugin refuses such an output. Add ``network.floating_ips`` to
          the list when Terraform sets the floating addresses, or set ``qumulo_managed_by:
          none`` when the provider did not form the cluster.'
        - cluster_baseline - applies the keytab of ``qumulo_kerberos`` with ``kerberos_keytab``
          before the domain join, and its setting with ``kerberos_settings`` after
          it, and refuses a keytab to install beside ``qumulo_ad`` before its first
          write.
        - 'cluster_baseline - before its first write, the role reads the cluster''s
          tenants, network document, SMB shares, NFS exports, NFS settings and each
          tenant''s NFS settings whenever the inventory declares any of ``qumulo_tenants``,
          ``qumulo_network``, ``qumulo_smb_shares``, ``qumulo_nfs_exports``, ``qumulo_nfs_settings``
          and ``qumulo_factory_defaults``, so the user the play connects as needs
          read access to each, ``PRIVILEGE_TENANT_READ`` for the tenant list included.
          Remedy: give the user read access to the tenants, the network, the SMB shares
          and the NFS exports and settings.'
        - 'cluster_baseline - floating ranges in ``qumulo_network.frontend_networks``
          that Terraform owns are refused before step 2 reads the cluster, in the
          role''s words, with where each is declared and the owner: ``qumulo_terraform_owned_areas``
          when the inventory gives the list, or ``qumulo_managed_by: terraform_provider``,
          since the provider applies its own floating addresses, when it does not.
          A tenant''s floating ranges are refused by the area refusal, which says
          the same of the provider. With no list and no ``qumulo_cluster_kind``, both
          messages also offer declaring an edge or bare-metal cluster''s kind. Remedy:
          remove the ranges, or ``network.floating_ips`` from ``qumulo_terraform_owned_areas``
          when there is one, or set ``qumulo_take_over_from_terraform: true``, which
          hands the role the audit destinations, ``dns.fqdn`` and the floating addresses
          together.'
        - cluster_baseline - new area ``tenants`` in ``qumulo_terraform_owned_areas``.
          It covers ``qumulo_tenants`` and the entries of ``qumulo_smb_shares`` and
          ``qumulo_nfs_exports`` that name their tenants with ``tenants`` or ``tenant_id``.
        - cluster_baseline - new role, with playbooks/baseline.yml, that brings a
          cluster's system and identity settings to the baseline its inventory declares,
          in the order the server's rules need; a second run changes nothing.
        - cluster_baseline - new variables ``qumulo_tenants``, the tenants by name
          with their services, networks, SMB and NFS settings, shares and exports,
          and ``qumulo_management_network``, ``qumulo_cluster_port`` and ``qumulo_cluster_kind``,
          which tell the continuity rule which network the play reaches the cluster
          on, which port the cluster listens on for it and whether the cluster is
          a cloud cluster. A null ``qumulo_cluster_kind`` counts as unset. Step 2
          reads the tenants, the network document, its status only when the cluster
          has two or more tenants or the run creates one, the shares, the exports,
          the NFS settings, each tenant's NFS settings and, with ``qumulo_tenants``
          declared and no kind, the protection type, and plans steps 3a to 20a with
          ``tenancy_plan``.
        - 'cluster_baseline - on a cluster whose ``qumulo_cluster_kind`` is ``edge``
          or ``baremetal`` and that the Terraform provider formed, with ``qumulo_managed_by:
          terraform_provider`` and no ``qumulo_terraform_owned_areas``, the role manages
          the floating addresses, and capture and adoption read its floating ranges.
          ``qumulo_terraform_owned_areas`` defaults to ``[network.floating_ips]``
          for a provider-formed cluster only when ``qumulo_cluster_kind`` is ``cnq``
          or unset, since the provider applies its floating addresses again only on
          CNQ, and to nothing for ``edge`` or ``baremetal``. Where Terraform sets
          the floating addresses of an ``edge`` or ``baremetal`` cluster, list ``network.floating_ips``
          in ``qumulo_terraform_owned_areas``, or in the output''s ``owned_areas``.'
        - cluster_baseline - refuses, before the role's first task, a key that a variable's
          options do not list, such as a misspelt ``session_encryption`` in ``qumulo_smb_settings``,
          since an ignored key leaves the option it meant unapplied and nothing says
          so. The check covers a key of the dict, or of an entry, of ``qumulo_filesystem_settings``,
          ``qumulo_web_ui_settings``, ``qumulo_directories``, ``qumulo_file_acls``,
          ``qumulo_smb_settings``, ``qumulo_smb_shares``, ``qumulo_nfs_settings``,
